# =============================================================================
# Workflow: Get Action Status
# Category: utilities
#
# Retrieves the status and output of an endpoint response action by its
# action ID. Used to check whether a previously initiated command (execute,
# isolate, release) has completed and to retrieve its output.
#
# Author: Elastic (modified by Security Agent Mesh)
# Created: 2025-12-04
# =============================================================================
name: Get Action Status
description: Check the status of a pending endpoint response action and retrieve output.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - utilities
  - response-actions

triggers:
  - type: manual

inputs:
  - name: action_id
    type: string
    description: "The action ID returned by an endpoint response action (execute, isolate, release)"
    required: true
  - name: endpoint_id
    type: string
    description: "The endpoint ID the action was sent to (needed to extract output)"
    required: true

steps:

  - name: get_action_status
    type: kibana.request
    with:
      method: GET
      path: /api/endpoint/action/{{ inputs.action_id }}

  - name: output_status
    type: console
    with:
      message: |
        Action ID: {{ inputs.action_id }}
        Command: {{ steps.get_action_status.output.data.command }}
        Host: {{ steps.get_action_status.output.data.hosts[inputs.endpoint_id].name }}
        Completed: {{ steps.get_action_status.output.data.isCompleted }}
        Successful: {{ steps.get_action_status.output.data.wasSuccessful }}
        Status: {{ steps.get_action_status.output.data.status }}
        Exit Code: {{ steps.get_action_status.output.data.outputs[inputs.endpoint_id].content.shell_code }}
        Shell: {{ steps.get_action_status.output.data.outputs[inputs.endpoint_id].content.shell }}

        === STDOUT ===
        {{ steps.get_action_status.output.data.outputs[inputs.endpoint_id].content.stdout }}

        === STDERR ===
        {{ steps.get_action_status.output.data.outputs[inputs.endpoint_id].content.stderr }}
