# =============================================================================
# Workflow: Remove Knowledge Document
# Category: knowledge
#
# Deletes a document from any Elasticsearch index by ID. Reads the document
# first to show the target and tolerates a missing one: the delete is
# idempotent, so a document that is already gone is not an error.
#
# This is a generic building block with no opinions on index mapping.
#
# Author: Elastic
# Created: 2026-02-19
# =============================================================================
name: Remove Knowledge Document
description: Delete a document from any Elasticsearch index by ID.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - data
  - knowledge

triggers:
  - type: manual

inputs:
  - name: index_name
    type: string
    description: Elasticsearch index containing the document
    required: true
  - name: document_id
    type: string
    description: The document ID to delete
    required: true

steps:

  - name: get_document
    type: elasticsearch.request
    with:
      method: GET
      path: "/{{ inputs.index_name }}/_doc/{{ inputs.document_id }}"
    on-failure:
      continue: true

  - name: delete_document
    type: elasticsearch.request
    with:
      method: DELETE
      path: "/{{ inputs.index_name }}/_doc/{{ inputs.document_id }}"
    on-failure:
      continue: true

  - name: confirm
    type: console
    with:
      message: |-
        {% if steps.delete_document.output.result == "deleted" %}
        Document {{ inputs.document_id }} removed from {{ inputs.index_name }}.
        {% else %}
        Document {{ inputs.document_id }} not found in {{ inputs.index_name }}.
        {% endif %}

