# =============================================================================
# Workflow: Get Rule Details
# Category: security/detection
#
# Retrieves the full definition of a detection rule. Accepts either
# rule_id (slug) or Kibana saved object id (UUID) — tries rule_id first,
# falls back to id. Uses explicit HTTP auth for subagent chain reliability.
#
# Author: Security Agent Mesh
# =============================================================================
name: Get Rule Details
description: Get the full definition of a detection rule by ID.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - detection-engineering

triggers:
  - type: manual

inputs:
  - name: rule_id
    type: string
    description: "The detection rule_id (slug-style) or Kibana saved object id
      (UUID). Both formats accepted."
    required: true

steps:

  - name: try_by_rule_id
    type: kibana.request
    with:
      method: GET
      path: "/api/detection_engine/rules"
      query:
        rule_id: "{{ inputs.rule_id }}"
    on-failure:
      continue: true

  - name: try_by_saved_object_id
    type: kibana.request
    condition: "{{ steps.try_by_rule_id.error != null }}"
    with:
      method: GET
      path: "/api/detection_engine/rules"
      query:
        id: "{{ inputs.rule_id }}"
    on-failure:
      continue: true

  - name: output_rule
    type: console
    with:
      message: "{% assign rule = steps.try_by_saved_object_id.output | default:
        steps.try_by_rule_id.output %}\n\
        Rule: {{ rule.name }}\n\
        Rule ID: {{ rule.rule_id }}\n\
        Saved Object ID: {{ rule.id }}\n\
        Type: {{ rule.type }}\n\
        Enabled: {{ rule.enabled }}\n\
        Severity: {{ rule.severity }}\n\
        Risk Score: {{ rule.risk_score }}\n\
        Description: {{ rule.description }}\n\
        Query: {{ rule.query }}\n\
        Language: {{ rule.language }}\n\
        Index: {{ rule.index }}\n\
        Tags: {{ rule.tags | join: \", \" }}\n\
        "
