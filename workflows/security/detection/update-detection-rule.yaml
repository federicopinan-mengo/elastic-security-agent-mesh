# =============================================================================
# Workflow: Update Detection Rule
# Category: security/detection
#
# Updates an existing detection rule via the Kibana Detection Engine PATCH API.
# Can modify query, severity, description, and other rule properties.
#
# Accepts either rule_id (slug) or saved object id (UUID) — tries rule_id
# first, falls back to id lookup, same pattern as get-rule-details.
#
# Author: Security Agent Mesh
# =============================================================================
name: Update Detection Rule
description: "Update an existing detection rule's query, severity, description,
  or other properties."
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - detection-engineering

triggers:
  - type: manual

inputs:
  - name: rule_id
    type: string
    description: "The rule_id (slug) or saved object id (UUID) of the rule to
      update"
    required: true
  - name: query
    type: string
    description: "Updated detection query (ES|QL, KQL, or EQL)"
    required: false
  - name: description
    type: string
    description: "Updated rule description"
    required: false
  - name: severity
    type: string
    description: "Updated severity: low, medium, high, critical"
    required: false
  - name: interval
    type: string
    description: "Updated run interval (e.g., 5m, 15m, 1h)"
    required: false
  - name: from
    type: string
    description: "Updated lookback period (e.g., now-6m, now-15m)"
    required: false
  - name: name
    type: string
    description: "Updated rule name"
    required: false

steps:

  # Try lookup by rule_id (slug) first
  - name: try_by_rule_id
    type: kibana.request
    with:
      method: GET
      path: "/api/detection_engine/rules"
      query:
        rule_id: "{{ inputs.rule_id }}"
    on-failure:
      continue: true

  # Fall back to saved object id (UUID) if rule_id lookup failed
  - name: try_by_uuid
    type: kibana.request
    condition: "{{ steps.try_by_rule_id.error != null }}"
    with:
      method: GET
      path: "/api/detection_engine/rules"
      query:
        id: "{{ inputs.rule_id }}"
    on-failure:
      continue: true

  - name: update_rule
    type: kibana.request
    with:
      method: PATCH
      path: "/api/detection_engine/rules"
      headers:
        Content-Type: application/json
      body:
        id: "{{ steps.try_by_uuid.output.id | default:
          steps.try_by_rule_id.output.id }}"
        query: "{{ inputs.query | default: steps.try_by_rule_id.output.query |
          default: steps.try_by_uuid.output.query }}"
        description: "{{ inputs.description | default:
          steps.try_by_rule_id.output.description | default:
          steps.try_by_uuid.output.description }}"
        severity: "{{ inputs.severity | default:
          steps.try_by_rule_id.output.severity | default:
          steps.try_by_uuid.output.severity }}"
        interval: "{{ inputs.interval | default:
          steps.try_by_rule_id.output.interval | default:
          steps.try_by_uuid.output.interval }}"
        from: "{{ inputs.from | default: steps.try_by_rule_id.output.from |
          default: steps.try_by_uuid.output.from }}"
    on-failure:
      continue: true

  - name: confirm
    type: console
    with:
      message: |
        Rule updated:
        Name: {{ steps.update_rule.output.name }}
        ID: {{ steps.update_rule.output.id }}
        Rule ID: {{ steps.update_rule.output.rule_id }}
        Severity: {{ steps.update_rule.output.severity }}
        Enabled: {{ steps.update_rule.output.enabled }}
