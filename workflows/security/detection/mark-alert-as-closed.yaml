# =============================================================================
# Workflow: Mark Alert as Closed
# Category: security/detection
#
# Closes a security alert. Uses the native security.setAlertStatus step,
# so it inherits the workflow execution context.
#
# Author: Security Agent Mesh
# =============================================================================
name: Mark Alert as Closed
description: Close a security alert.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - detection
  - triage

triggers:
  - type: manual

inputs:
  - name: alertid
    type: string
    description: "The alert ID to close"
    required: true
  - name: reason
    type: string
    description: >-
      Close reason: false_positive, duplicate, true_positive,
      benign_positive, automated_closure, other
    default: "other"

steps:

  - name: close_alert
    type: security.setAlertStatus
    with:
      alert_ids:
        - "{{ inputs.alertid }}"
      status: closed
      close_reason: "{{ inputs.reason }}"

  - name: confirm
    type: console
    with:
      message: "Alert {{ inputs.alertid }} closed"
