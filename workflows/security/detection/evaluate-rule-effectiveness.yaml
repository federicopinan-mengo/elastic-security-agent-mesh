# =============================================================================
# Workflow: Evaluate Rule Effectiveness
# Category: security/detection
#
# Retrieves execution metrics for a detection rule — how often it runs,
# how many alerts it generates, failure rate, and gap analysis. Helps
# detection engineers tune rules and identify noisy or broken detections.
#
# Author: Security Agent Mesh
# =============================================================================
name: Evaluate Rule Effectiveness
description: "Get execution metrics and alert counts for a detection rule to
  assess its effectiveness."
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - detection-engineering

triggers:
  - type: manual

inputs:
  - name: rule_id
    type: string
    description: "The rule_id (slug) or saved object id (UUID) to evaluate"
    required: true

steps:

  - name: get_rule
    type: kibana.request
    with:
      method: GET
      path: "/api/detection_engine/rules"
      query:
        rule_id: "{{ inputs.rule_id }}"

  - name: get_alerts_for_rule
    type: elasticsearch.request
    with:
      method: POST
      path: "/.alerts-security.alerts-*/_search"
      body:
        size: 0
        query:
          bool:
            must:
              - term:
                  kibana.alert.rule.uuid: "{{ steps.get_rule.output.id }}"
        aggs:
          by_status:
            terms:
              field: "kibana.alert.workflow_status"
          by_severity:
            terms:
              field: "kibana.alert.severity"
          alerts_over_time:
            date_histogram:
              field: "@timestamp"
              calendar_interval: "day"
          by_host:
            terms:
              field: "host.name"
              size: 10
          by_source_ip:
            terms:
              field: "source.ip"
              size: 10

  - name: get_execution_log
    type: kibana.request
    with:
      method: GET
      path: "/internal/detection_engine/rules/{{ steps.get_rule.output.id
        }}/_execution_results"
      query:
        start: "now-7d"
        end: "now"
        per_page: 100
        sort_field: timestamp
        sort_order: desc

  - name: output_report
    type: console
    with:
      message: "=== Rule Effectiveness Report ===\n\
        Rule: {{ steps.get_rule.output.name }}\n\
        Rule ID: {{ steps.get_rule.output.rule_id }}\n\
        Type: {{ steps.get_rule.output.type }} ({{
        steps.get_rule.output.language }})\n\
        Severity: {{ steps.get_rule.output.severity }}\n\
        Enabled: {{ steps.get_rule.output.enabled }}\n\
        Interval: {{ steps.get_rule.output.interval }}\n\
        \n\
        === Alert Summary ===\n\
        Total alerts: {{ steps.get_alerts_for_rule.output.hits.total.value }}\n\
        By status: {{
        steps.get_alerts_for_rule.output.aggregations.by_status.buckets }}\n\
        By severity: {{
        steps.get_alerts_for_rule.output.aggregations.by_severity.buckets }}\n\
        Top hosts: {{
        steps.get_alerts_for_rule.output.aggregations.by_host.buckets }}\n\
        Top source IPs: {{
        steps.get_alerts_for_rule.output.aggregations.by_source_ip.buckets }}\n\
        \n\
        === Execution Log (last 7 days) ===\n\
        {{ steps.get_execution_log.output }}\n\
        "
