# =============================================================================
# Workflow: Evaluate MITRE ATT&CK Coverage
# Category: security/detection
#
# Fetches all enabled detection rules, extracts their MITRE technique
# mappings, and compares against the ATT&CK knowledge base to identify
# coverage gaps. Uses explicit HTTP auth for subagent chain reliability.
#
# Author: Security Agent Mesh
# =============================================================================
name: Evaluate MITRE Coverage
description: "Identify gaps in MITRE ATT&CK technique coverage across detection
  rules."
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - detection-engineering
  - mitre

triggers:
  - type: manual

inputs:
  - name: enabled_only
    type: boolean
    description: "Only evaluate enabled rules (recommended for production
      coverage)"
    default: true
  - name: tactic_filter
    type: string
    description: "Filter to a specific tactic (e.g., 'Initial Access',
      'Execution'). Leave empty for all."
    required: false

steps:

  - name: fetch_all_rules
    type: kibana.request
    with:
      method: GET
      path: "/api/detection_engine/rules/_find"
      query:
        per_page: 1000
        sort_field: name
        sort_order: asc

  - name: extract_coverage
    type: console
    with:
      message: |
        {%- assign enabled = inputs.enabled_only == true -%}
        {% assign rules = steps.fetch_all_rules.output.data %}
        {% assign total_rules = steps.fetch_all_rules.output.total %}
        {% assign covered = "" | split: "" %}
        {% assign covered_count = 0 %}
        {% for rule in rules %}
          {% if enabled and rule.enabled == false %}{% continue %}{% endif %}
          {% if rule.threat %}
            {% for threat in rule.threat %}
              {% if threat.technique %}
                {% for technique in threat.technique %}
                  {% unless covered contains technique.id %}
                    {% assign covered = covered | push: technique.id %}
                    {% assign covered_count = covered_count | plus: 1 %}
                  {% endunless %}
                {% endfor %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endfor %}
        Total rules: {{ total_rules }}
        Unique MITRE techniques covered: {{ covered_count }}
        Techniques: {{ covered | join: ", " }}

  - name: search_kb_techniques
    type: elasticsearch.request
    with:
      method: POST
      path: "/kb-mitre-attack/_search"
      body:
        size: 0
        track_total_hits: true
        query:
          match_all: {}
    on-failure:
      continue: true

  - name: output_summary
    type: console
    with:
      message: |
        {%- assign total_rules = steps.fetch_all_rules.output.total -%}
        {%- assign kb_hits = steps.search_kb_techniques.output.hits -%}
        {%- assign kb_total = kb_hits.total.value -%}
        {%- assign tactic = inputs.tactic_filter -%}
        === MITRE ATT&CK Coverage Report ===
        Total detection rules evaluated: {{ total_rules }}
        Enabled only: {{ inputs.enabled_only }}
        {% if tactic %}Tactic filter: {{ tactic }}{% endif %}
        Total techniques in KB: {{ kb_total }}
