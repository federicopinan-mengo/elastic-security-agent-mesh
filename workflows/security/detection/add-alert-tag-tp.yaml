# =============================================================================
# Workflow: Add Alert Tag - TP
# Category: security/detection
#
# Tags a security alert as a true positive. Uses the native
# security.setAlertTags step, so it inherits the workflow execution
# context instead of carrying its own credential.
#
# Author: Security Agent Mesh
# =============================================================================
name: Add Alert Tag - TP
description: Tag a security alert as a true positive.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - detection
  - triage

triggers:
  - type: manual

inputs:
  - name: alertid
    type: string
    description: "The alert ID to tag as true positive"
    required: true

steps:

  - name: set_tp_tag
    type: security.setAlertTags
    with:
      alert_ids:
        - "{{ inputs.alertid }}"
      tags_to_add:
        - "Triaged as True Positive by AI"
      tags_to_remove: []

  - name: confirm
    type: console
    with:
      message: "Alert {{ inputs.alertid }} tagged as True Positive"
