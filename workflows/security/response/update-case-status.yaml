# =============================================================================
# Workflow: Update Case Status
# Category: security/response
#
# Updates a case's status, severity, or other properties. Fetches the
# current version first (required for optimistic concurrency), then patches.
#
# Author: Security Agent Mesh
# =============================================================================
name: Update Case Status
description: Update a case status, severity, or close a case.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - response
  - cases

triggers:
  - type: manual

inputs:
  - name: case_id
    type: string
    description: "The case ID to update"
    required: true
  - name: status
    type: string
    description: "New status: open, in-progress, closed"
    required: false
  - name: severity
    type: string
    description: "New severity: low, medium, high, critical"
    required: false

steps:

  - name: get_case
    type: kibana.request
    with:
      method: GET
      path: "/api/cases/{{ inputs.case_id }}"

  - name: update_case
    type: kibana.request
    with:
      method: PATCH
      path: "/api/cases"
      headers:
        Content-Type: application/json
      body:
        cases:
          - id: "{{ inputs.case_id }}"
            version: "{{ steps.get_case.output.version }}"
            status: "{{ inputs.status | default: steps.get_case.output.status }}"
            severity: "{{ inputs.severity | default: steps.get_case.output.severity }}"

  - name: confirm
    type: console
    with:
      message: |
        Case {{ inputs.case_id }} updated.
        Status: {{ inputs.status | default: 'unchanged' }}
        Severity: {{ inputs.severity | default: 'unchanged' }}
