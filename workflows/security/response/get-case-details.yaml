# =============================================================================
# Workflow: Get Case Details
# Category: security/response
#
# Retrieves full details of an Elastic Security case including status,
# severity, description, comments count, and linked alerts.
#
# Author: Security Agent Mesh
# =============================================================================
name: Get Case Details
description: Get the full details of a case by its ID.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - response
  - cases

triggers:
  - type: manual

inputs:
  - name: case_id
    type: string
    description: "The case ID to retrieve"
    required: true

steps:

  - name: get_case
    type: kibana.request
    with:
      method: GET
      path: "/api/cases/{{ inputs.case_id }}"

  - name: output_details
    type: console
    with:
      message: |
        Case: {{ steps.get_case.output.title }}
        ID: {{ steps.get_case.output.id }}
        Status: {{ steps.get_case.output.status }}
        Severity: {{ steps.get_case.output.severity }}
        Owner: {{ steps.get_case.output.owner }}
        Created: {{ steps.get_case.output.created_at }}
        Updated: {{ steps.get_case.output.updated_at }}
        Comments: {{ steps.get_case.output.totalComment }}
        Alerts: {{ steps.get_case.output.totalAlerts }}
        Tags: {{ steps.get_case.output.tags | join: ", " }}
        Description: {{ steps.get_case.output.description }}
