# =============================================================================
# Workflow: Get Case Details
# Category: security/response
#
# Retrieves full details of an Elastic Security case including status,
# severity, description, comments count, and linked alerts.
#
# Author: Security Agent Mesh
# =============================================================================
name: Get Case Details
description: Get the full details of a case by its ID.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - response
  - cases

triggers:
  - type: manual

inputs:
  - name: case_id
    type: string
    description: "The case ID to retrieve"
    required: true

steps:

  - name: get_case
    type: cases.getCase
    with:
      case_id: "{{ inputs.case_id }}"

  - name: output_details
    type: console
    with:
      message: |
        Case: {{ steps.get_case.output.case.title }}
        ID: {{ steps.get_case.output.case.id }}
        Status: {{ steps.get_case.output.case.status }}
        Severity: {{ steps.get_case.output.case.severity }}
        Owner: {{ steps.get_case.output.case.owner }}
        Created: {{ steps.get_case.output.case.created_at }}
        Updated: {{ steps.get_case.output.case.updated_at }}
        Comments: {{ steps.get_case.output.case.totalComment }}
        Alerts: {{ steps.get_case.output.case.totalAlerts }}
        Tags: {{ steps.get_case.output.case.tags | join: ", " }}
        Description: {{ steps.get_case.output.case.description }}
