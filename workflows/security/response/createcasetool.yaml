# =============================================================================
# Workflow: Create Case
# Category: security/response
#
# Creates a new Elastic Security case for tracking incidents and
# investigations. Uses the GA Cases domain step instead of the generic
# Kibana REST escape hatch.
#
# Author: Security Agent Mesh
# =============================================================================
name: Create Case
description: Create an Elastic Security case for incident tracking.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - response
  - cases

triggers:
  - type: manual

inputs:
  - name: caseTitle
    required: true
    type: string
    description: "Title for the case"
  - name: caseDescription
    required: true
    type: string
    description: "Detailed description of the incident or investigation"
  - name: severity
    type: string
    description: "Case severity: low, medium, high, critical"
    default: "medium"

steps:

  - name: create_case
    type: cases.createCase
    with:
      title: "{{ inputs.caseTitle }}"
      description: "{{ inputs.caseDescription }}"
      owner: "securitySolution"
      tags:
        - agent-mesh
        - auto-generated
      severity: "{{ inputs.severity }}"
      settings:
        syncAlerts: true

  - name: confirm
    type: console
    with:
      message: |
        Case created successfully.
        Case ID: {{ steps.create_case.output.case.id }}
        Title: {{ steps.create_case.output.case.title }}
        Severity: {{ steps.create_case.output.case.severity }}
        Owner: {{ steps.create_case.output.case.owner }}
