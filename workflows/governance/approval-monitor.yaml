# =============================================================================
# Workflow: Approval Monitor
# Category: governance
#
# Scheduled workflow that polls the approval-requests index for pending
# requests, checks the associated Kibana case for a human APPROVED/DENIED
# response, and queues a dispatch when approved.
#
# Runs every 2 minutes. Closes the governance loop:
#   Agent requests approval → human reviews on case → monitor detects
#   response → writes dispatch request → dispatch monitor invokes agent
#
# Detection strategy:
#   1. Fetch the 50 most recent case comments (newest first)
#   2. Decide with Liquid over that history: the newest decision that comes
#      after the approval request wins, and a comment that predates the
#      request is never read as a decision
#   3. APPROVED or DENIED decide it; an explicit "not approved" is not a
#      decision and leaves the request pending
#
# Dispatch strategy:
#   Instead of calling the agent directly (which blocks on 5+ min agent
#   sessions and hits the gateway timeout), we write a dispatch request
#   to the dispatch-requests index. The dispatch monitor picks it up
#   within 1 minute and handles invocation, retry, and failure notification.
#
# Author: Security Agent Mesh
# =============================================================================
name: Approval Monitor
description: Polls for human responses to pending approval requests and dispatches approved actions.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - governance
  - scheduled

triggers:
  - type: scheduled
    with:
      every: "2m"

steps:

  # ── Step 1: Find all pending approval requests ──────────────────────────
  - name: find_pending
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /approval-requests/_search
      body:
        size: 10
        query:
          term:
            status: "pending"
        sort:
          - created_at: "asc"

  - name: log_pending_count
    type: console
    on-failure:
      continue: true
    with:
      message: >-
        Found {{ steps.find_pending.output.hits.total.value | default: 0 }}
        pending approval requests.

  # ── Step 2: Process each pending request ────────────────────────────────
  - name: process_approvals
    type: foreach
    foreach: "{{ steps.find_pending.output.hits.hits }}"
    steps:

      # 2a. Fetch the most recent comments on the case, newest first.
      - name: fetch_recent_comments
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: GET
          path: /api/cases/{{ foreach.item._source.case_id }}/comments/_find
          query:
            sortOrder: desc
            perPage: 50

      # 2b. Decide from the comment history, not from the last comment only.
      #     The newest decision after the approval request wins, and the
      #     request template itself is never read as a decision.
      - name: decide_approval
        type: console
        on-failure:
          continue: true
        with:
          message: |
            {% assign comments = steps.fetch_recent_comments.output.comments %}
            {% assign decision = 'PENDING' %}
            {% for c in comments %}
              {% assign text = c.comment | default: '' %}
              {% if text contains 'Human Approval Required' %}
                {% break %}
              {% elsif decision == 'PENDING' %}
                {% if text contains 'DENIED' %}
                  {% assign decision = 'DENIED' %}
                {% elsif text contains 'NOT APPROVED' %}
                  {% assign decision = 'PENDING' %}
                {% elsif text contains 'APPROVED' %}
                  {% assign decision = 'APPROVED' %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ decision }}

      - name: log_decision
        type: console
        with:
          message: >-
            Approval {{ foreach.item._source.approval_id }} — decision:
            {{ steps.decide_approval.output | strip | truncate: 40 }}

      # 2c. No decision in the comment history yet.
      - name: check_still_pending
        type: if
        condition: 'steps.decide_approval.output: *PENDING*'
        steps:

          - name: log_still_pending
            type: console
            with:
              message: >-
                Approval {{ foreach.item._source.approval_id }} still pending —
                no decision in the case comments yet.

        else:

          # ── A newer comment exists — check for human decision ───────────
          - name: check_approved
            type: if
            condition: 'steps.decide_approval.output: *APPROVED*'
            steps:

              - name: log_approval
                type: console
                with:
                  message: "Approval {{ foreach.item._source.approval_id }} APPROVED by human. Queuing dispatch for {{ foreach.item._source.target_agent }}."

              - name: mark_approved
                type: elasticsearch.request
                with:
                  method: POST
                  path: /approval-requests/_update/{{ foreach.item._id }}
                  body:
                    doc:
                      status: "approved"
                      resolved_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
                      resolved_by: "human"

              # Write a dispatch request instead of calling the agent directly.
              # The dispatch monitor picks this up within 1 minute and handles
              # invocation, retry, and failure notification.
              - name: write_dispatch
                type: elasticsearch.request
                on-failure:
                  continue: true
                with:
                  method: POST
                  path: /dispatch-requests/_doc
                  body:
                    dispatch_id: "apr-dispatch-{{ foreach.item._source.approval_id }}"
                    requesting_agent: "approval-monitor"
                    target_agent: "{{ foreach.item._source.target_agent }}"
                    case_id: "{{ foreach.item._source.case_id }}"
                    investigation_id: "{{ foreach.item._source.investigation_id }}"
                    priority: "urgent"
                    context: |
                      APPROVED ACTION — Execute the following approved action.

                      Approval ID: {{ foreach.item._source.approval_id }}
                      Case ID: {{ foreach.item._source.case_id }}
                      Investigation ID: {{ foreach.item._source.investigation_id }}
                      Action: {{ foreach.item._source.action_type }}
                      Target: {{ foreach.item._source.target }}
                      Risk Tier: {{ foreach.item._source.risk_tier }}

                      Context from the requesting agent:
                      {{ foreach.item._source.context }}

                      Instructions:
                      1. Execute the approved action described above
                      2. Add a case comment to {{ foreach.item._source.case_id }} documenting what was done and the result
                      3. If the action completes successfully, update the case with your findings
                      4. If the action fails, add a case comment explaining the failure
                    status: "pending"
                    created_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"

              - name: mark_executed
                type: elasticsearch.request
                on-failure:
                  continue: true
                with:
                  method: POST
                  path: /approval-requests/_update/{{ foreach.item._id }}
                  body:
                    doc:
                      status: "executed"
                      execution_result: "Dispatch request queued for {{ foreach.item._source.target_agent }}."

              - name: add_executed_comment
                type: cases.addComment
                on-failure:
                  continue: true
                with:
                  case_id: "{{ foreach.item._source.case_id }}"
                  comment: |
                      ## Action Approved and Dispatched

                      **Approval ID:** {{ foreach.item._source.approval_id }}
                      **Action:** {{ foreach.item._source.action_type }} on {{ foreach.item._source.target }}
                      **Dispatched to:** {{ foreach.item._source.target_agent }}

                      The approved action has been queued for dispatch. The dispatch monitor will invoke the agent within 1 minute. Results will be posted as follow-up comments.

            else:

              # ── Check for DENIED ──────────────────────────────────────────
              - name: check_denied
                type: if
                condition: 'steps.decide_approval.output: *DENIED*'
                steps:

                  - name: log_denial
                    type: console
                    with:
                      message: "Approval {{ foreach.item._source.approval_id }} DENIED by human."

                  - name: mark_denied
                    type: elasticsearch.request
                    with:
                      method: POST
                      path: /approval-requests/_update/{{ foreach.item._id }}
                      body:
                        doc:
                          status: "rejected"
                          resolved_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
                          resolved_by: "human"

                  - name: add_denied_comment
                    type: cases.addComment
                    on-failure:
                      continue: true
                    with:
                      case_id: "{{ foreach.item._source.case_id }}"
                      comment: |
                          ## Action Denied

                          **Approval ID:** {{ foreach.item._source.approval_id }}
                          **Action:** {{ foreach.item._source.action_type }} on {{ foreach.item._source.target }}

                          This action was denied by a human reviewer. No action has been taken.

                else:

                  - name: log_unrecognized
                    type: console
                    with:
                      message: >-
                        Approval
                        {{ foreach.item._source.approval_id }} — comment
                        history holds no APPROVED/DENIED keyword. Decision:
                        {{ steps.decide_approval.output | strip
                        | truncate: 40 }}
