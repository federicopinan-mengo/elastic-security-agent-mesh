# =============================================================================
# Workflow: Dispatch Specialist (Async)
# Category: mesh
#
# Writes an async dispatch request to the dispatch-requests index.
# The dispatch-monitor workflow polls this index every minute and
# invokes the target agent in its own independent session — no
# synchronous blocking, no nested timeouts.
#
# Use this instead of Call Subagent when:
#   - The calling agent doesn't need to wait for the result
#   - The target agent's work is complex and may take several minutes
#   - You're in an automated triage/investigation chain
#
# Keep using Call Subagent when:
#   - A human is waiting for an immediate response (orchestrator flow)
#   - The calling agent needs the result to continue its own work
#
# Author: Security Agent Mesh
# =============================================================================
name: Dispatch Specialist
description: Queue an async dispatch request for a specialist agent.
enabled: true

tags:
  - agent-mesh
  - mesh
  - async-dispatch

triggers:
  - type: manual

inputs:
  - name: document_id
    type: string
    description: "Original investigation-contexts document ID for the L2 envelope retrieval"
    required: true
  - name: context
    type: string
    description: "L1 escalation summary for the L2 Investigation Analyst"
    required: true
  - name: case_id
    type: string
    description: "Case ID for tracking (the target agent will also receive this in the context)"
    required: false
  - name: priority
    type: string
    description: "Priority: urgent or normal. Urgent dispatches are processed first."
    default: "normal"

consts:
  es_url: "__ES_URL__"
  es_api_key: "__ES_API_KEY__"

steps:

  - name: derive_idempotency_key
    type: console
    with:
      message: "l1d--1--{{ inputs.document_id }}--security-mesh.l1-triage-analyst--security-mesh.l2-investigation-analyst"

  # A query avoids an unnecessary create in the normal duplicate path. The
  # deterministic _create in the else branch is still required to close races.
  - name: find_active_dispatch
    type: http
    with:
      method: POST
      url: "{{ consts.es_url }}/dispatch-requests/_search"
      headers:
        Content-Type: application/json
        Authorization: "ApiKey {{ consts.es_api_key }}"
      body:
        size: 1
        query:
          bool:
            filter:
              - term:
                  idempotency_key: "{{ steps.derive_idempotency_key.output }}"
              - terms:
                  status: ["pending", "dispatched"]

  - name: create_dispatch_request
    type: if
    condition: steps.find_active_dispatch.output.data.hits.total.value > 0
    steps:
      - name: duplicate_noop
        type: console
        with:
          message: "Active L1-to-L2 dispatch {{ steps.derive_idempotency_key.output }} already exists; status and retry_count are unchanged."
    else:
      - name: create_request
        type: http
        on-failure:
          continue: true
        with:
          method: PUT
          url: "{{ consts.es_url }}/dispatch-requests/_create/{{ steps.derive_idempotency_key.output }}"
          headers:
            Content-Type: application/json
            Authorization: "ApiKey {{ consts.es_api_key }}"
          body:
            dispatch_id: "{{ steps.derive_idempotency_key.output }}"
            idempotency_key: "{{ steps.derive_idempotency_key.output }}"
            requesting_agent: "security-mesh.l1-triage-analyst"
            target_agent: "security-mesh.l2-investigation-analyst"
            case_id: "{{ inputs.case_id | default: '' }}"
            investigation_id: "{{ inputs.document_id }}"
            priority: "{{ inputs.priority }}"
            context: "L2 envelope document ID: {{ inputs.document_id }}\n{{ inputs.context }}"
            status: "pending"
            retry_count: 0
            created_at: "{{ 'now' | date: '%Y-%m-%dT%H:%M:%SZ' }}"
