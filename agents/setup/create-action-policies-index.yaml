# =============================================================================
# Workflow: Create Action Policies Index
# Category: setup
#
# Creates the action-policies index that stores governance tier definitions.
# Each document defines the risk tier, approval requirements, and blast-radius
# limits for a specific action type.
#
# Run once during initial mesh setup, then seed with default policies.
# The Python setup script handles this automatically; this workflow is
# available as a manual alternative.
#
# Author: Security Agent Mesh
# =============================================================================
name: Create Action Policies Index
description: Create the action-policies index for governance tier definitions.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - setup
  - infrastructure
  - governance

triggers:
  - type: manual

consts:
  index_name: "action-policies"

steps:

  - name: check_index_exists
    type: elasticsearch.request
    with:
      method: GET
      path: "/{{ consts.index_name }}"
    on-failure:
      fallback:

        - name: create_index
          type: elasticsearch.request
          with:
            method: PUT
            path: "/{{ consts.index_name }}"
            headers:
              Content-Type: application/json
            body:
              settings:
                number_of_shards: 1
                number_of_replicas: 1
              mappings:
                properties:
                  action_type:
                    type: keyword
                  risk_tier:
                    type: keyword
                  allowed_callers:
                    type: keyword
                  auto_approve:
                    type: object
                    properties:
                      min_confidence:
                        type: float
                      max_blast_radius:
                        type: integer
                      required_evidence_count:
                        type: integer
                  requires_approval:
                    type: boolean
                  approval_channel:
                    type: keyword
                  rollback_workflow:
                    type: keyword
                  ttl_minutes:
                    type: integer
                  description:
                    type: text

        - name: confirm_creation
          type: console
          with:
            message: >-
              Action policies index created. Seed with default policies using
              the setup script.
      continue: true


  - name: report_index_state
    type: console
    with:
      message: |-
        {% if steps.check_index_exists.output %}
        Index {{ consts.index_name }} already exists.
        {% endif %}
