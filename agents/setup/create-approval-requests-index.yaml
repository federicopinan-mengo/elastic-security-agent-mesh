# =============================================================================
# Workflow: Create Approval Requests Index
# Category: setup
#
# Creates the approval-requests index for tracking governance-gated actions
# through their full lifecycle: request → human review → approval/denial →
# agent dispatch → execution.
#
# Run once during initial mesh setup. The Python setup script handles this
# automatically; this workflow is available as a manual alternative.
#
# Author: Security Agent Mesh
# =============================================================================
name: Create Approval Requests Index
description: Create the approval-requests index for tracking governance-gated action approvals.
enabled: true

tags:
  - oputils-mesh
  - agent-mesh
  - setup
  - infrastructure
  - governance

triggers:
  - type: manual

consts:
  index_name: "approval-requests"

steps:

  - name: check_index_exists
    type: elasticsearch.request
    with:
      method: GET
      path: "/{{ consts.index_name }}"
    on-failure:
      fallback:

        - name: create_index
          type: elasticsearch.request
          with:
            method: PUT
            path: "/{{ consts.index_name }}"
            headers:
              Content-Type: application/json
            body:
              settings:
                number_of_shards: 1
                number_of_replicas: 1
              mappings:
                properties:
                  approval_id:
                    type: keyword
                  case_id:
                    type: keyword
                  investigation_id:
                    type: keyword
                  requesting_agent:
                    type: keyword
                  target_agent:
                    type: keyword
                  action_type:
                    type: keyword
                  action_details:
                    type: text
                  context:
                    type: text
                  target:
                    type: keyword
                  status:
                    type: keyword
                  risk_tier:
                    type: keyword
                  justification:
                    type: text
                  created_at:
                    type: date
                  resolved_at:
                    type: date
                  resolved_by:
                    type: keyword
                  execution_result:
                    type: text

        - name: confirm_creation
          type: console
          with:
            message: >-
              Approval requests index created. Agents can now submit
              structured approval requests.
      continue: true


  - name: report_index_state
    type: console
    with:
      message: |-
        {% if steps.check_index_exists.output %}
        Index {{ consts.index_name }} already exists.
        {% endif %}
